<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Central Command</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --black: #000;
    --dark: #080808;
    --panel: #101010;
    --border: #242424;
    --hover: #181818;
    --text: #fff;
    --muted: #888;
}

body {
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background: var(--black);
    color: var(--text);

    height: 100vh;
    overflow: hidden;
}

button,
input,
textarea,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

/* =========================
   APP
========================= */

.app {
    display: flex;
    width: 100%;
    height: 100vh;
}

/* =========================
   SIDEBAR
========================= */

.sidebar {
    width: 260px;
    height: 100vh;

    background: #050505;

    border-right: 1px solid var(--border);

    display: flex;
    flex-direction: column;
}

.sidebar-header {
    height: 64px;

    display: flex;
    align-items: center;

    padding: 0 18px;

    border-bottom: 1px solid var(--border);
}

.system-name {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: .5px;
}

.new-button {
    margin: 18px 14px;

    background: white;
    color: black;

    border: none;
    border-radius: 7px;

    padding: 11px 14px;

    font-size: 13px;
    font-weight: 600;
}

.new-button:hover {
    background: #ddd;
}

.sidebar-section {
    margin-top: 8px;
}

.sidebar-label {
    padding: 0 18px;
    margin-bottom: 7px;

    color: #666;

    font-size: 10px;
    font-weight: 600;

    letter-spacing: 1.5px;
}

.nav-button {
    width: calc(100% - 16px);

    margin: 2px 8px;

    padding: 10px;

    background: transparent;

    border: none;
    border-radius: 7px;

    color: #999;

    text-align: left;

    font-size: 13px;
}

.nav-button:hover {
    background: var(--hover);
    color: white;
}

.nav-button.active {
    background: #1b1b1b;
    color: white;
}

.brand-list {
    flex: 1;

    overflow-y: auto;

    margin-top: 12px;
}

.brand-list-title {
    padding: 0 18px;

    color: #555;

    font-size: 10px;
    font-weight: 600;

    letter-spacing: 1.5px;

    margin-bottom: 7px;
}

.brand-item {
    width: calc(100% - 16px);

    margin: 2px 8px;

    padding: 8px 10px;

    display: flex;
    align-items: center;

    gap: 10px;

    border: none;
    border-radius: 7px;

    background: transparent;

    color: #999;

    text-align: left;
}

.brand-item:hover {
    background: var(--hover);
    color: white;
}

.brand-item.active {
    background: #1b1b1b;
    color: white;
}

.brand-icon {
    width: 28px;
    height: 28px;

    flex-shrink: 0;

    background: #202020;

    border-radius: 6px;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
}

.brand-icon img {
    width: 100%;
    height: 100%;

    object-fit: cover;
}

.brand-icon-text {
    font-size: 10px;
    font-weight: 700;
}

.brand-name {
    font-size: 13px;

    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.sidebar-footer {
    padding: 15px;

    border-top: 1px solid var(--border);

    color: #555;

    font-size: 11px;
}

/* =========================
   MAIN
========================= */

.main {
    flex: 1;

    height: 100vh;

    display: flex;
    flex-direction: column;
}

.topbar {
    height: 64px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 30px;

    border-bottom: 1px solid var(--border);
}

.topbar-title {
    font-size: 14px;
    font-weight: 500;
}

.system-status {
    color: #555;

    font-size: 11px;
}

.content {
    flex: 1;

    overflow-y: auto;

    padding: 50px 30px;
}

.content-inner {
    width: 100%;
    max-width: 900px;

    margin: 0 auto;
}

/* =========================
   EMPTY STATE
========================= */

.empty-state {
    min-height: calc(100vh - 170px);

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;
}

.empty-logo {
    width: 60px;
    height: 60px;

    border: 1px solid #333;

    border-radius: 14px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-weight: 700;
    font-size: 20px;

    margin-bottom: 22px;
}

.empty-state h1 {
    font-size: 28px;
    font-weight: 600;

    margin-bottom: 10px;
}

.empty-state p {
    color: var(--muted);

    font-size: 14px;

    margin-bottom: 25px;
}

.primary-button {
    background: white;
    color: black;

    border: none;
    border-radius: 7px;

    padding: 11px 18px;

    font-size: 13px;
    font-weight: 600;
}

.primary-button:hover {
    background: #ddd;
}

/* =========================
   BRAND VIEW
========================= */

.brand-header {
    display: flex;

    align-items: center;

    gap: 20px;

    padding-bottom: 28px;

    border-bottom: 1px solid var(--border);
}

.large-logo {
    width: 82px;
    height: 82px;

    flex-shrink: 0;

    background: #151515;

    border: 1px solid #292929;

    border-radius: 16px;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
}

.large-logo img {
    width: 100%;
    height: 100%;

    object-fit: cover;
}

.large-logo-text {
    font-size: 28px;
    font-weight: 700;
}

.brand-header h1 {
    font-size: 30px;
    font-weight: 600;

    margin-bottom: 5px;
}

.brand-header p {
    color: var(--muted);

    font-size: 13px;
}

.description {
    margin-top: 30px;

    color: #bbb;

    font-size: 15px;
    line-height: 1.7;

    white-space: pre-wrap;
}

.actions {
    display: flex;

    gap: 10px;

    margin-top: 30px;
}

.secondary-button {
    padding: 10px 16px;

    background: transparent;

    color: white;

    border: 1px solid #333;

    border-radius: 7px;

    font-size: 13px;
}

.secondary-button:hover {
    background: #171717;
}

.danger-button {
    padding: 10px 16px;

    background: transparent;

    color: #d88;

    border: 1px solid #442020;

    border-radius: 7px;

    font-size: 13px;
}

.danger-button:hover {
    background: #1c1010;
}

/* =========================
   BUSINESS IDEAS
========================= */

.page-header {
    margin-bottom: 30px;
}

.page-header h1 {
    font-size: 28px;

    font-weight: 600;

    margin-bottom: 8px;
}

.page-header p {
    color: var(--muted);

    font-size: 14px;
}

.toolbar {
    display: flex;

    gap: 10px;

    margin-bottom: 20px;
}

.search {
    flex: 1;

    background: #090909;

    border: 1px solid #303030;

    border-radius: 7px;

    color: white;

    padding: 11px 13px;

    outline: none;
}

.search:focus {
    border-color: #666;
}

.idea-card {
    border: 1px solid var(--border);

    background: #090909;

    border-radius: 10px;

    padding: 20px;

    margin-bottom: 10px;
}

.idea-top {
    display: flex;

    justify-content: space-between;

    gap: 20px;

    margin-bottom: 10px;
}

.idea-title {
    font-size: 17px;

    font-weight: 600;

    margin-bottom: 5px;
}

.idea-category {
    color: #777;

    font-size: 11px;

    text-transform: uppercase;

    letter-spacing: 1px;
}

.idea-description {
    color: #aaa;

    font-size: 13px;

    line-height: 1.6;

    margin-top: 12px;
}

.idea-metrics {
    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 10px;

    margin-top: 18px;
}

.metric {
    padding: 12px;

    background: #111;

    border-radius: 7px;
}

.metric-label {
    color: #666;

    font-size: 10px;

    text-transform: uppercase;

    margin-bottom: 5px;
}

.metric-value {
    font-size: 13px;

    font-weight: 600;
}

.idea-status {
    display: inline-block;

    margin-top: 15px;

    padding: 5px 9px;

    background: #191919;

    border-radius: 5px;

    color: #aaa;

    font-size: 10px;

    text-transform: uppercase;

    letter-spacing: .7px;
}

.idea-actions {
    display: flex;

    gap: 7px;

    margin-top: 17px;
}

.small-button {
    padding: 7px 11px;

    background: transparent;

    border: 1px solid #333;

    border-radius: 6px;

    color: #aaa;

    font-size: 11px;
}

.small-button:hover {
    color: white;

    border-color: #666;
}

/* =========================
   MODAL
========================= */

.modal-overlay {
    position: fixed;

    inset: 0;

    background: rgba(0,0,0,.78);

    display: none;

    align-items: center;
    justify-content: center;

    z-index: 100;
}

.modal-overlay.show {
    display: flex;
}

.modal {
    width: 500px;

    max-width: calc(100% - 30px);

    max-height: 90vh;

    overflow-y: auto;

    background: #0b0b0b;

    border: 1px solid #292929;

    border-radius: 12px;

    padding: 25px;

    box-shadow: 0 20px 60px rgba(0,0,0,.5);
}

.modal-header {
    display: flex;

    align-items: center;
    justify-content: space-between;

    margin-bottom: 25px;
}

.modal-header h2 {
    font-size: 18px;

    font-weight: 600;
}

.close-button {
    width: 30px;
    height: 30px;

    background: transparent;

    border: none;

    border-radius: 6px;

    color: #777;

    font-size: 18px;
}

.close-button:hover {
    background: #1a1a1a;

    color: white;
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;

    margin-bottom: 7px;

    color: #aaa;

    font-size: 12px;
}

.form-input,
.form-textarea,
.form-select {
    width: 100%;

    background: #050505;

    border: 1px solid #303030;

    border-radius: 7px;

    color: white;

    padding: 11px 12px;

    outline: none;

    font-size: 13px;
}

.form-input:focus,
.form-textarea:focus,
.form-select:focus {
    border-color: #666;
}

.form-textarea {
    min-height: 110px;

    resize: vertical;
}

.form-row {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 12px;
}

.modal-actions {
    display: flex;

    justify-content: flex-end;

    gap: 10px;

    margin-top: 25px;
}

.cancel-button {
    padding: 10px 15px;

    background: transparent;

    border: 1px solid #333;

    border-radius: 7px;

    color: #aaa;

    font-size: 13px;
}

.save-button {
    padding: 10px 17px;

    background: white;

    border: none;

    border-radius: 7px;

    color: black;

    font-size: 13px;

    font-weight: 600;
}

.save-button:hover {
    background: #ddd;
}

/* =========================
   LOGO UPLOAD
========================= */

.logo-upload {
    display: flex;

    align-items: center;

    gap: 15px;
}

.logo-preview {
    width: 65px;
    height: 65px;

    background: #151515;

    border: 1px solid #303030;

    border-radius: 12px;

    display: flex;

    align-items: center;
    justify-content: center;

    overflow: hidden;
}

.logo-preview img {
    width: 100%;
    height: 100%;

    object-fit: cover;
}

.logo-placeholder {
    color: #555;

    font-size: 20px;
}

.upload-label {
    display: inline-block;

    padding: 9px 13px;

    border: 1px solid #333;

    border-radius: 7px;

    color: #ccc;

    font-size: 12px;

    cursor: pointer;
}

.upload-label:hover {
    background: #171717;
}

#logoInput {
    display: none;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px) {

    .sidebar {
        width: 210px;
    }

    .content {
        padding: 35px 20px;
    }

    .idea-metrics {
        grid-template-columns: 1fr;
    }

}

@media(max-width:560px) {

    .sidebar {
        width: 70px;
    }

    .system-name {
        font-size: 0;
    }

    .system-name::after {
        content: "CC";

        font-size: 14px;
    }

    .new-button {
        width: 40px;
        height: 40px;

        margin: 15px auto;

        padding: 0;

        font-size: 0;
    }

    .new-button::after {
        content: "+";

        font-size: 20px;
    }

    .sidebar-label,
    .brand-list-title,
    .brand-name,
    .sidebar-footer {
        display: none;
    }

    .nav-button {
        text-align: center;

        font-size: 0;
    }

    .nav-button:first-letter {
        font-size: 18px;
    }

}
</style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="sidebar-header">

            <div class="system-name">
                CENTRAL COMMAND
            </div>

        </div>


        <button
            class="new-button"
            onclick="openCreateBrandModal()"
        >
            + New Brand
        </button>


        <div class="sidebar-section">

            <div class="sidebar-label">
                SYSTEM
            </div>

            <button
                id="brandsNav"
                class="nav-button active"
                onclick="showBrands()"
            >
                Brands
            </button>

            <button
                id="ideasNav"
                class="nav-button"
                onclick="showIdeas()"
            >
                Business Ideas
            </button>

        </div>


        <div class="brand-list">

            <div class="brand-list-title">
                BRANDS
            </div>

            <div id="brandList"></div>

        </div>


        <div class="sidebar-footer">
            Central Command V0.2.0
        </div>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <header class="topbar">

            <div id="topbarTitle" class="topbar-title">
                Brands
            </div>

            <div class="system-status">
                SYSTEM ONLINE
            </div>

        </header>


        <div class="content">

            <div
                id="contentInner"
                class="content-inner"
            ></div>

        </div>

    </main>

</div>


<!-- =========================
     MODAL
========================= -->

<div
    id="modalOverlay"
    class="modal-overlay"
>

    <div class="modal">

        <div class="modal-header">

            <h2 id="modalTitle">
                Create Brand
            </h2>

            <button
                class="close-button"
                onclick="closeModal()"
            >
                ×
            </button>

        </div>


        <form id="brandForm">

            <!-- BRAND LOGO -->

            <div class="form-group">

                <label>
                    Brand Logo
                </label>

                <div class="logo-upload">

                    <div
                        id="logoPreview"
                        class="logo-preview"
                    >
                        <div class="logo-placeholder">
                            +
                        </div>
                    </div>


                    <div>

                        <label
                            for="logoInput"
                            class="upload-label"
                        >
                            Choose Image
                        </label>

                        <input
                            id="logoInput"
                            type="file"
                            accept="image/*"
                        >

                    </div>

                </div>

            </div>


            <!-- NAME -->

            <div class="form-group">

                <label>
                    Brand Name
                </label>

                <input
                    id="brandName"
                    class="form-input"
                    type="text"
                    placeholder="Example: Central Foods"
                    required
                >

            </div>


            <!-- DESCRIPTION -->

            <div class="form-group">

                <label>
                    Description
                </label>

                <textarea
                    id="brandDescription"
                    class="form-textarea"
                    placeholder="Describe the brand..."
                ></textarea>

            </div>


            <div class="modal-actions">

                <button
                    type="button"
                    class="cancel-button"
                    onclick="closeModal()"
                >
                    Cancel
                </button>

                <button
                    type="submit"
                    class="save-button"
                >
                    Save Brand
                </button>

            </div>

        </form>

    </div>

</div>


<!-- =========================
     BUSINESS IDEA MODAL
========================= -->

<div
    id="ideaModalOverlay"
    class="modal-overlay"
>

    <div class="modal">

        <div class="modal-header">

            <h2 id="ideaModalTitle">
                New Business Idea
            </h2>

            <button
                class="close-button"
                onclick="closeIdeaModal()"
            >
                ×
            </button>

        </div>


        <form id="ideaForm">

            <!-- IDEA NAME -->

            <div class="form-group">

                <label>
                    Business Idea
                </label>

                <input
                    id="ideaName"
                    class="form-input"
                    type="text"
                    placeholder="Example: Online Grocery Platform"
                    required
                >

            </div>


            <!-- CATEGORY -->

            <div class="form-group">

                <label>
                    Industry / Category
                </label>

                <select
                    id="ideaCategory"
                    class="form-select"
                >

                    <option value="Technology">
                        Technology
                    </option>

                    <option value="Finance">
                        Finance
                    </option>

                    <option value="Food & Beverage">
                        Food & Beverage
                    </option>

                    <option value="Retail">
                        Retail
                    </option>

                    <option value="Healthcare">
                        Healthcare
                    </option>

                    <option value="Education">
                        Education
                    </option>

                    <option value="Transportation">
                        Transportation
                    </option>

                    <option value="Real Estate">
                        Real Estate
                    </option>

                    <option value="Media">
                        Media
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <!-- DESCRIPTION -->

            <div class="form-group">

                <label>
                    Description
                </label>

                <textarea
                    id="ideaDescription"
                    class="form-textarea"
                    placeholder="Describe the business idea..."
                ></textarea>

            </div>


            <!-- FINANCIALS -->

            <div class="form-row">

                <div class="form-group">

                    <label>
                        Estimated Startup Cost
                    </label>

                    <input
                        id="ideaCost"
                        class="form-input"
                        type="text"
                        placeholder="$10,000"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Potential Revenue
                    </label>

                    <input
                        id="ideaRevenue"
                        class="form-input"
                        type="text"
                        placeholder="$100,000 / year"
                    >

                </div>

            </div>


            <!-- STATUS -->

            <div class="form-group">

                <label>
                    Status
                </label>

                <select
                    id="ideaStatus"
                    class="form-select"
                >

                    <option value="Idea">
                        Idea
                    </option>

                    <option value="Researching">
                        Researching
                    </option>

                    <option value="Planning">
                        Planning
                    </option>

                    <option value="Building">
                        Building
                    </option>

                    <option value="Launched">
                        Launched
                    </option>

                    <option value="Paused">
                        Paused
                    </option>

                </select>

            </div>


            <div class="modal-actions">

                <button
                    type="button"
                    class="cancel-button"
                    onclick="closeIdeaModal()"
                >
                    Cancel
                </button>

                <button
                    type="submit"
                    class="save-button"
                >
                    Save Idea
                </button>

            </div>

        </form>

    </div>

</div>


<script>

/* =====================================================
   DATA
===================================================== */

let brands =
    JSON.parse(
        localStorage.getItem(
            "centralCommandBrands"
        )
    ) || [];


let businessIdeas =
    JSON.parse(
        localStorage.getItem(
            "centralCommandBusinessIdeas"
        )
    ) || [];


let selectedBrandId = null;

let editingBrandId = null;

let editingIdeaId = null;

let currentLogo = "";


/* =====================================================
   ELEMENTS
===================================================== */

const contentInner =
    document.getElementById(
        "contentInner"
    );

const brandList =
    document.getElementById(
        "brandList"
    );

const topbarTitle =
    document.getElementById(
        "topbarTitle"
    );

const modalOverlay =
    document.getElementById(
        "modalOverlay"
    );

const ideaModalOverlay =
    document.getElementById(
        "ideaModalOverlay"
    );


/* =====================================================
   STORAGE
===================================================== */

function saveBrands() {

    localStorage.setItem(
        "centralCommandBrands",
        JSON.stringify(brands)
    );

}


function saveIdeas() {

    localStorage.setItem(
        "centralCommandBusinessIdeas",
        JSON.stringify(businessIdeas)
    );

}


/* =====================================================
   NAVIGATION
===================================================== */

function setActiveNav(active) {

    document
        .getElementById("brandsNav")
        .classList.remove("active");

    document
        .getElementById("ideasNav")
        .classList.remove("active");

    document
        .getElementById(active)
        .classList.add("active");

}


function showBrands() {

    setActiveNav("brandsNav");

    renderBrandList();

    if (selectedBrandId) {

        renderBrand();

    } else {

        renderEmptyState();

    }

}


function showIdeas() {

    setActiveNav("ideasNav");

    renderIdeas();

}


/* =====================================================
   BRAND LIST
===================================================== */

function renderBrandList() {

    brandList.innerHTML = "";


    brands.forEach(brand => {

        const button =
            document.createElement(
                "button"
            );

        button.className =
            "brand-item" +
            (
                brand.id === selectedBrandId
                    ? " active"
                    : ""
            );


        button.onclick = () => {

            selectedBrandId =
                brand.id;

            showBrands();

        };


        const icon =
            document.createElement(
                "div"
            );

        icon.className =
            "brand-icon";


        if (brand.logo) {

            const image =
                document.createElement(
                    "img"
                );

            image.src =
                brand.logo;

            icon.appendChild(image);

        } else {

            const text =
                document.createElement(
                    "div"
                );

            text.className =
                "brand-icon-text";

            text.textContent =
                getInitials(
                    brand.name
                );

            icon.appendChild(text);

        }


        const name =
            document.createElement(
                "div"
            );

        name.className =
            "brand-name";

        name.textContent =
            brand.name;


        button.appendChild(icon);

        button.appendChild(name);

        brandList.appendChild(button);

    });

}


/* =====================================================
   EMPTY STATE
===================================================== */

function renderEmptyState() {

    topbarTitle.textContent =
        "Brands";


    contentInner.innerHTML = `

        <div class="empty-state">

            <div class="empty-logo">
                CC
            </div>

            <h1>
                Create your first brand
            </h1>

            <p>
                Manage your brands from one central system.
            </p>

            <button
                class="primary-button"
                onclick="openCreateBrandModal()"
            >
                + Create Brand
            </button>

        </div>

    `;

}


/* =====================================================
   BRAND VIEW
===================================================== */

function renderBrand() {

    const brand =
        brands.find(
            item =>
                item.id ===
                selectedBrandId
        );


    if (!brand) {

        renderEmptyState();

        return;

    }


    topbarTitle.textContent =
        brand.name;


    const logo =
        brand.logo

            ? `
                <img
                    src="${brand.logo}"
                    alt="Brand Logo"
                >
              `

            : `
                <div class="large-logo-text">
                    ${escapeHTML(
                        getInitials(
                            brand.name
                        )
                    )}
                </div>
              `;


    contentInner.innerHTML = `

        <div>

            <div class="brand-header">

                <div class="large-logo">

                    ${logo}

                </div>


                <div>

                    <h1>
                        ${escapeHTML(
                            brand.name
                        )}
                    </h1>

                    <p>
                        Brand
                    </p>

                </div>

            </div>


            <div class="description">

                ${escapeHTML(
                    brand.description ||
                    "No description provided."
                )}

            </div>


            <div class="actions">

                <button
                    class="secondary-button"
                    onclick="openEditBrandModal(
                        '${brand.id}'
                    )"
                >
                    Edit Brand
                </button>


                <button
                    class="danger-button"
                    onclick="deleteBrand(
                        '${brand.id}'
                    )"
                >
                    Delete Brand
                </button>

            </div>

        </div>

    `;

}


/* =====================================================
   CREATE BRAND
===================================================== */

function openCreateBrandModal() {

    editingBrandId = null;

    currentLogo = "";

    document
        .getElementById(
            "modalTitle"
        )
        .textContent =
        "Create Brand";


    document
        .getElementById(
            "brandForm"
        )
        .reset();


    showLogoPreview("");


    modalOverlay.classList.add(
        "show"
    );

}


function openEditBrandModal(id) {

    const brand =
        brands.find(
            item =>
                item.id === id
        );


    if (!brand) return;


    editingBrandId =
        id;

    currentLogo =
        brand.logo || "";


    document
        .getElementById(
            "modalTitle"
        )
        .textContent =
        "Edit Brand";


    document
        .getElementById(
            "brandName"
        )
        .value =
        brand.name;


    document
        .getElementById(
            "brandDescription"
        )
        .value =
        brand.description || "";


    document
        .getElementById(
            "logoInput"
        )
        .value = "";


    showLogoPreview(
        currentLogo
    );


    modalOverlay.classList.add(
        "show"
    );

}


function closeModal() {

    modalOverlay.classList.remove(
        "show"
    );

}


/* =====================================================
   LOGO
===================================================== */

document
    .getElementById(
        "logoInput"
    )
    .addEventListener(
        "change",
        function() {

            const file =
                this.files[0];


            if (!file) return;


            const reader =
                new FileReader();


            reader.onload =
                function(event) {

                    currentLogo =
                        event.target.result;

                    showLogoPreview(
                        currentLogo
                    );

                };


            reader.readAsDataURL(
                file
            );

        }
    );


function showLogoPreview(src) {

    const preview =
        document.getElementById(
            "logoPreview"
        );


    if (src) {

        preview.innerHTML =
            `
                <img
                    src="${src}"
                    alt="Logo"
                >
            `;

    } else {

        preview.innerHTML =
            `
                <div class="logo-placeholder">
                    +
                </div>
            `;

    }

}


/* =====================================================
   SAVE BRAND
===================================================== */

document
    .getElementById(
        "brandForm"
    )
    .addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            const name =
                document
                    .getElementById(
                        "brandName"
                    )
                    .value
                    .trim();


            const description =
                document
                    .getElementById(
                        "brandDescription"
                    )
                    .value
                    .trim();


            if (!name) {

                alert(
                    "Please enter a brand name."
                );

                return;

            }


            if (editingBrandId) {

                const brand =
                    brands.find(
                        item =>
                            item.id ===
                            editingBrandId
                    );


                if (!brand) return;


                brand.name =
                    name;

                brand.description =
                    description;

                brand.logo =
                    currentLogo;


                selectedBrandId =
                    brand.id;

            } else {

                const newBrand = {

                    id:
                        Date.now().toString(),

                    name:
                        name,

                    description:
                        description,

                    logo:
                        currentLogo,

                    createdAt:
                        new Date().toISOString()

                };


                brands.push(
                    newBrand
                );


                selectedBrandId =
                    newBrand.id;

            }


            saveBrands();

            closeModal();

            renderBrandList();

            renderBrand();

        }
    );


/* =====================================================
   DELETE BRAND
===================================================== */

function deleteBrand(id) {

    const brand =
        brands.find(
            item =>
                item.id === id
        );


    if (!brand) return;


    const confirmed =
        confirm(
            `Delete "${brand.name}"?`
        );


    if (!confirmed) return;


    brands =
        brands.filter(
            item =>
                item.id !== id
        );


    selectedBrandId =
        null;


    saveBrands();

    renderBrandList();

    renderEmptyState();

}


/* =====================================================
   BUSINESS IDEAS
===================================================== */

function renderIdeas(
    searchQuery = ""
) {

    topbarTitle.textContent =
        "Business Ideas";


    const query =
        searchQuery
            .toLowerCase()
            .trim();


    const filteredIdeas =
        businessIdeas.filter(
            idea =>

                idea.name
                    .toLowerCase()
                    .includes(query)

                ||

                idea.description
                    .toLowerCase()
                    .includes(query)

                ||

                idea.category
                    .toLowerCase()
                    .includes(query)
        );


    contentInner.innerHTML = `

        <div>

            <div class="page-header">

                <h1>
                    Business Ideas
                </h1>

                <p>
                    Build and manage your business idea database.
                </p>

            </div>


            <div class="toolbar">

                <input
                    id="ideaSearch"
                    class="search"
                    type="text"
                    placeholder="Search business ideas..."
                    value="${escapeHTML(
                        searchQuery
                    )}"
                    oninput="renderIdeas(this.value)"
                >


                <button
                    class="primary-button"
                    onclick="openCreateIdeaModal()"
                >
                    + New Idea
                </button>

            </div>


            <div>

                ${
                    filteredIdeas.length === 0

                    ?

                    `
                        <div
                            style="
                                border:1px solid #222;
                                padding:40px;
                                text-align:center;
                                border-radius:10px;
                                color:#666;
                            "
                        >
                            No business ideas found.
                        </div>
                    `

                    :

                    filteredIdeas
                        .map(
                            idea =>
                                createIdeaCard(
                                    idea
                                )
                        )
                        .join("")
                }

            </div>

        </div>

    `;

}


function createIdeaCard(idea) {

    return `

        <div class="idea-card">

            <div class="idea-top">

                <div>

                    <div class="idea-title">

                        ${escapeHTML(
                            idea.name
                        )}

                    </div>


                    <div class="idea-category">

                        ${escapeHTML(
                            idea.category
                        )}

                    </div>

                </div>

            </div>


            <div class="idea-description">

                ${escapeHTML(
                    idea.description ||
                    "No description provided."
                )}

            </div>


            <div class="idea-metrics">

                <div class="metric">

                    <div class="metric-label">
                        Startup Cost
                    </div>

                    <div class="metric-value">

                        ${escapeHTML(
                            idea.cost ||
                            "Not specified"
                        )}

                    </div>

                </div>


                <div class="metric">

                    <div class="metric-label">
                        Potential Revenue
                    </div>

                    <div class="metric-value">

                        ${escapeHTML(
                            idea.revenue ||
                            "Not specified"
                        )}

                    </div>

                </div>


                <div class="metric">

                    <div class="metric-label">
                        Status
                    </div>

                    <div class="metric-value">

                        ${escapeHTML(
                            idea.status
                        )}

                    </div>

                </div>

            </div>


            <div class="idea-actions">

                <button
                    class="small-button"
                    onclick="openEditIdeaModal(
                        '${idea.id}'
                    )"
                >
                    Edit
                </button>


                <button
                    class="small-button"
                    onclick="deleteIdea(
                        '${idea.id}'
                    )"
                >
                    Delete
                </button>

            </div>

        </div>

    `;

}

/* =====================================================
   UTILITIES
===================================================== */

function getInitials(name) {

    return name
        .split(" ")
        .filter(Boolean)
        .slice(0, 2)
        .map(
            word =>
                word
                    .charAt(0)
                    .toUpperCase()
        )
        .join("");

}


function escapeHTML(text) {

    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}

   MODAL EVENTS
===================================================== */

modalOverlay.addEventListener(
    "click",
    function(event) {

        if (
            event.target ===
            modalOverlay
        ) {

        }

    }
);

    "click",
    function(event) {

            event.target ===
            ideaModalOverlay
        ) {

            closeIdeaModal();

        }

    }
);


document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Escape"
        ) {

            closeModal();

            closeIdeaModal();

        }

    }
);

   INITIALIZE
===================================================== */

renderBrandList();


if (brands.length > 0) {
