<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Central Command — Brands</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --black: #000000;
            --dark: #0a0a0a;
            --panel: #111111;
            --border: #242424;
            --text: #ffffff;
            --muted: #8b8b8b;
            --hover: #1a1a1a;
        }

        body {
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: var(--black);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        /* =========================
           APP
        ========================= */

        .app {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            width: 260px;
            height: 100vh;

            background: #050505;
            border-right: 1px solid var(--border);

            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            height: 64px;

            display: flex;
            align-items: center;

            padding: 0 18px;

            border-bottom: 1px solid var(--border);
        }

        .brand-system-name {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .new-brand {
            margin: 18px 14px;

            padding: 11px 14px;

            background: white;
            color: black;

            border: none;
            border-radius: 7px;

            font-size: 13px;
            font-weight: 600;

            transition: 0.15s;
        }

        .new-brand:hover {
            background: #dddddd;
        }

        .sidebar-label {
            color: #666;
            font-size: 10px;
            font-weight: 600;

            letter-spacing: 1.5px;

            padding: 0 18px;
            margin-bottom: 8px;
        }

        .brand-list {
            flex: 1;

            overflow-y: auto;

            padding: 0 8px;
        }

        .brand-item {
            width: 100%;

            display: flex;
            align-items: center;
            gap: 10px;

            padding: 9px 10px;

            border-radius: 7px;

            background: transparent;
            border: none;

            color: #aaa;

            text-align: left;

            margin-bottom: 2px;

            transition: 0.15s;
        }

        .brand-item:hover {
            background: var(--hover);
            color: white;
        }

        .brand-item.active {
            background: #1b1b1b;
            color: white;
        }

        .brand-icon {
            width: 28px;
            height: 28px;

            border-radius: 6px;

            background: #222;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            flex-shrink: 0;
        }

        .brand-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .brand-icon-text {
            font-size: 11px;
            font-weight: 700;
        }

        .brand-item-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;

            font-size: 13px;
        }

        .sidebar-footer {
            padding: 15px;

            border-top: 1px solid var(--border);

            color: #555;

            font-size: 11px;
        }

        /* =========================
           MAIN
        ========================= */

        .main {
            flex: 1;
            height: 100vh;

            display: flex;
            flex-direction: column;
        }

        .topbar {
            height: 64px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 30px;

            border-bottom: 1px solid var(--border);
        }

        .topbar-title {
            font-size: 14px;
            font-weight: 500;
        }

        .topbar-status {
            font-size: 11px;
            color: #666;
        }

        .content {
            flex: 1;

            overflow-y: auto;

            padding: 55px 30px;
        }

        .content-inner {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
        }

        /* =========================
           EMPTY STATE
        ========================= */

        .empty-state {
            min-height: calc(100vh - 170px);

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;
        }

        .empty-logo {
            width: 58px;
            height: 58px;

            border: 1px solid #333;
            border-radius: 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 22px;
            font-weight: 700;

            margin-bottom: 22px;
        }

        .empty-state h1 {
            font-size: 27px;
            font-weight: 600;

            margin-bottom: 10px;
        }

        .empty-state p {
            color: var(--muted);
            font-size: 14px;

            margin-bottom: 25px;
        }

        .primary-button {
            background: white;
            color: black;

            border: none;
            border-radius: 7px;

            padding: 11px 18px;

            font-size: 13px;
            font-weight: 600;
        }

        .primary-button:hover {
            background: #ddd;
        }

        /* =========================
           BRAND VIEW
        ========================= */

        .brand-view {
            padding-top: 10px;
        }

        .brand-header {
            display: flex;
            align-items: center;
            gap: 20px;

            padding-bottom: 28px;

            border-bottom: 1px solid var(--border);
        }

        .large-logo {
            width: 82px;
            height: 82px;

            border-radius: 16px;

            background: #151515;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            border: 1px solid #292929;

            flex-shrink: 0;
        }

        .large-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .large-logo-text {
            font-size: 28px;
            font-weight: 700;
        }

        .brand-header h1 {
            font-size: 30px;
            font-weight: 600;

            margin-bottom: 6px;
        }

        .brand-header p {
            color: var(--muted);
            font-size: 14px;
        }

        .brand-description {
            margin-top: 30px;

            color: #bdbdbd;

            font-size: 15px;
            line-height: 1.7;

            white-space: pre-wrap;
        }

        .brand-actions {
            display: flex;
            gap: 10px;

            margin-top: 35px;
        }

        .secondary-button {
            padding: 10px 16px;

            border: 1px solid #333;
            border-radius: 7px;

            background: transparent;
            color: white;

            font-size: 13px;
        }

        .secondary-button:hover {
            background: #171717;
        }

        .danger-button {
            padding: 10px 16px;

            border: 1px solid #442020;
            border-radius: 7px;

            background: transparent;
            color: #d88;

            font-size: 13px;
        }

        .danger-button:hover {
            background: #1c1010;
        }

        /* =========================
           MODAL
        ========================= */

        .modal-overlay {
            position: fixed;
            inset: 0;

            background: rgba(0, 0, 0, 0.75);

            display: none;
            align-items: center;
            justify-content: center;

            z-index: 100;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            width: 470px;
            max-width: calc(100% - 30px);

            background: #0b0b0b;

            border: 1px solid #292929;
            border-radius: 12px;

            padding: 25px;

            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 25px;
        }

        .modal-header h2 {
            font-size: 18px;
            font-weight: 600;
        }

        .close-button {
            width: 30px;
            height: 30px;

            border: none;
            border-radius: 6px;

            background: transparent;
            color: #777;

            font-size: 18px;
        }

        .close-button:hover {
            background: #1a1a1a;
            color: white;
        }

        .form-group {
            margin-bottom: 19px;
        }

        .form-group label {
            display: block;

            margin-bottom: 7px;

            font-size: 12px;
            color: #aaa;
        }

        .form-input,
        .form-textarea {
            width: 100%;

            background: #050505;

            border: 1px solid #303030;
            border-radius: 7px;

            color: white;

            padding: 11px 12px;

            outline: none;

            font-size: 13px;
        }

        .form-input:focus,
        .form-textarea:focus {
            border-color: #666;
        }

        .form-textarea {
            min-height: 110px;
            resize: vertical;
        }

        /* LOGO UPLOAD */

        .logo-upload {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-preview {
            width: 65px;
            height: 65px;

            border-radius: 12px;

            background: #151515;

            border: 1px solid #303030;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            flex-shrink: 0;
        }

        .logo-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .logo-placeholder {
            font-size: 20px;
            color: #555;
        }

        .upload-label {
            display: inline-block;

            padding: 9px 13px;

            border: 1px solid #333;
            border-radius: 7px;

            color: #ccc;

            font-size: 12px;

            cursor: pointer;
        }

        .upload-label:hover {
            background: #171717;
        }

        #logoInput {
            display: none;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;

            margin-top: 25px;
        }

        .cancel-button {
            padding: 10px 15px;

            border: 1px solid #333;
            border-radius: 7px;

            background: transparent;
            color: #aaa;

            font-size: 13px;
        }

        .save-button {
            padding: 10px 17px;

            border: none;
            border-radius: 7px;

            background: white;
            color: black;

            font-size: 13px;
            font-weight: 600;
        }

        .save-button:hover {
            background: #ddd;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .sidebar {
                width: 210px;
            }

            .content {
                padding: 35px 20px;
            }

            .brand-header h1 {
                font-size: 24px;
            }

            .topbar {
                padding: 0 20px;
            }
        }

        @media (max-width: 560px) {

            .sidebar {
                width: 70px;
            }

            .sidebar-header {
                justify-content: center;
                padding: 0;
            }

            .brand-system-name {
                font-size: 0;
            }

            .brand-system-name::after {
                content: "CC";
                font-size: 14px;
            }

            .new-brand {
                margin: 15px auto;
                width: 40px;
                height: 40px;
                padding: 0;
                font-size: 0;
            }

            .new-brand::after {
                content: "+";
                font-size: 20px;
            }

            .sidebar-label {
                display: none;
            }

            .brand-item {
                justify-content: center;
                padding: 8px;
            }

            .brand-item-name {
                display: none;
            }

            .sidebar-footer {
                display: none;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- =========================
         SIDEBAR
    ========================= -->

    <aside class="sidebar">

        <div class="sidebar-header">
            <div class="brand-system-name">
                CENTRAL COMMAND
            </div>
        </div>

        <button class="new-brand" onclick="openCreateModal()">
            + New Brand
        </button>

        <div class="sidebar-label">
            BRANDS
        </div>

        <div id="brandList" class="brand-list"></div>

        <div class="sidebar-footer">
            Central Command V0.1.0
        </div>

    </aside>


    <!-- =========================
         MAIN
    ========================= -->

    <main class="main">

        <header class="topbar">

            <div id="topbarTitle" class="topbar-title">
                Brands
            </div>

            <div class="topbar-status">
                SYSTEM ONLINE
            </div>

        </header>


        <div class="content">

            <div id="contentInner" class="content-inner">

                <!-- Content generated by JavaScript -->

            </div>

        </div>

    </main>

</div>


<!-- =========================
     CREATE / EDIT MODAL
========================= -->

<div id="modalOverlay" class="modal-overlay">

    <div class="modal">

        <div class="modal-header">

            <h2 id="modalTitle">
                Create Brand
            </h2>

            <button
                class="close-button"
                onclick="closeModal()"
            >
                ×
            </button>

        </div>


        <form id="brandForm">

            <div class="form-group">

                <label>
                    Brand Logo
                </label>

                <div class="logo-upload">

                    <div id="logoPreview" class="logo-preview">
                        <div class="logo-placeholder">
                            +
                        </div>
                    </div>

                    <div>
                        <label
                            for="logoInput"
                            class="upload-label"
                        >
                            Choose Image
                        </label>

                        <input
                            id="logoInput"
                            type="file"
                            accept="image/*"
                        >
                    </div>

                </div>

            </div>


            <div class="form-group">

                <label for="brandName">
                    Brand Name
                </label>

                <input
                    id="brandName"
                    class="form-input"
                    type="text"
                    placeholder="Example: Central Foods"
                    required
                >

            </div>


            <div class="form-group">

                <label for="brandDescription">
                    Description
                </label>

                <textarea
                    id="brandDescription"
                    class="form-textarea"
                    placeholder="Describe this brand..."
                ></textarea>

            </div>


            <div class="modal-actions">

                <button
                    type="button"
                    class="cancel-button"
                    onclick="closeModal()"
                >
                    Cancel
                </button>

                <button
                    type="submit"
                    class="save-button"
                >
                    Save Brand
                </button>

            </div>

        </form>

    </div>

</div>


<script>

    /* =========================
       DATA
    ========================= */

    let brands = JSON.parse(
        localStorage.getItem("centralCommandBrands")
    ) || [];

    let selectedBrandId = null;

    let editingBrandId = null;

    let currentLogo = "";


    /* =========================
       ELEMENTS
    ========================= */

    const brandList =
        document.getElementById("brandList");

    const contentInner =
        document.getElementById("contentInner");

    const topbarTitle =
        document.getElementById("topbarTitle");

    const modalOverlay =
        document.getElementById("modalOverlay");

    const brandForm =
        document.getElementById("brandForm");

    const brandName =
        document.getElementById("brandName");

    const brandDescription =
        document.getElementById("brandDescription");

    const logoInput =
        document.getElementById("logoInput");

    const logoPreview =
        document.getElementById("logoPreview");

    const modalTitle =
        document.getElementById("modalTitle");


    /* =========================
       SAVE DATA
    ========================= */

    function saveData() {

        localStorage.setItem(
            "centralCommandBrands",
            JSON.stringify(brands)
        );

    }


    /* =========================
       BRAND LIST
    ========================= */

    function renderBrandList() {

        brandList.innerHTML = "";

        brands.forEach(brand => {

            const button =
                document.createElement("button");

            button.className =
                "brand-item" +
                (brand.id === selectedBrandId
                    ? " active"
                    : "");

            button.onclick = () => {
                selectBrand(brand.id);
            };


            const icon =
                document.createElement("div");

            icon.className = "brand-icon";


            if (brand.logo) {

                const image =
                    document.createElement("img");

                image.src = brand.logo;

                icon.appendChild(image);

            } else {

                const text =
                    document.createElement("div");

                text.className =
                    "brand-icon-text";

                text.textContent =
                    getInitials(brand.name);

                icon.appendChild(text);

            }


            const name =
                document.createElement("div");

            name.className =
                "brand-item-name";

            name.textContent =
                brand.name;


            button.appendChild(icon);
            button.appendChild(name);

            brandList.appendChild(button);

        });

    }


    /* =========================
       SELECT BRAND
    ========================= */

    function selectBrand(id) {

        selectedBrandId = id;

        renderBrandList();

        renderBrand();

    }


    /* =========================
       RENDER BRAND
    ========================= */

    function renderBrand() {

        const brand =
            brands.find(
                item => item.id === selectedBrandId
            );


        if (!brand) {

            renderEmptyState();

            return;

        }


        topbarTitle.textContent =
            brand.name;


        const logo =
            brand.logo
                ? `<img src="${brand.logo}" alt="">`
                : `<div class="large-logo-text">
                       ${escapeHTML(getInitials(brand.name))}
                   </div>`;


        contentInner.innerHTML = `

            <div class="brand-view">

                <div class="brand-header">

                    <div class="large-logo">
                        ${logo}
                    </div>

                    <div>

                        <h1>
                            ${escapeHTML(brand.name)}
                        </h1>

                        <p>
                            Brand
                        </p>

                    </div>

                </div>


                <div class="brand-description">

                    ${escapeHTML(
                        brand.description ||
                        "No description provided."
                    )}

                </div>


                <div class="brand-actions">

                    <button
                        class="secondary-button"
                        onclick="openEditModal('${brand.id}')"
                    >
                        Edit Brand
                    </button>

                    <button
                        class="danger-button"
                        onclick="deleteBrand('${brand.id}')"
                    >
                        Delete Brand
                    </button>

                </div>

            </div>

        `;

    }


    /* =========================
       EMPTY STATE
    ========================= */

    function renderEmptyState() {

        topbarTitle.textContent =
            "Brands";


        contentInner.innerHTML = `

            <div class="empty-state">

                <div class="empty-logo">
                    CC
                </div>

                <h1>
                    Create your first brand
                </h1>

                <p>
                    Manage your brands from one central system.
                </p>

                <button
                    class="primary-button"
                    onclick="openCreateModal()"
                >
                    + Create Brand
                </button>

            </div>

        `;

    }


    /* =========================
       CREATE MODAL
    ========================= */

    function openCreateModal() {

        editingBrandId = null;

        currentLogo = "";

        modalTitle.textContent =
            "Create Brand";

        brandName.value = "";

        brandDescription.value = "";

        logoInput.value = "";

        showLogoPreview("");

        modalOverlay.classList.add("show");

        setTimeout(() => {
            brandName.focus();
        }, 100);

    }


    /* =========================
       EDIT MODAL
    ========================= */

    function openEditModal(id) {

        const brand =
            brands.find(
                item => item.id === id
            );

        if (!brand) return;

        editingBrandId = id;

        currentLogo =
            brand.logo || "";

        modalTitle.textContent =
            "Edit Brand";

        brandName.value =
            brand.name;

        brandDescription.value =
            brand.description || "";

        logoInput.value = "";

        showLogoPreview(currentLogo);

        modalOverlay.classList.add("show");

    }


    /* =========================
       CLOSE MODAL
    ========================= */

    function closeModal() {

        modalOverlay.classList.remove("show");

    }


    /* =========================
       LOGO PREVIEW
    ========================= */

    logoInput.addEventListener(
        "change",
        function() {

            const file =
                this.files[0];

            if (!file) return;

            const reader =
                new FileReader();

            reader.onload = function(event) {

                currentLogo =
                    event.target.result;

                showLogoPreview(
                    currentLogo
                );

            };

            reader.readAsDataURL(file);

        }
    );


    function showLogoPreview(src) {

        if (src) {

            logoPreview.innerHTML =
                `<img src="${src}" alt="Logo">`;

        } else {

            logoPreview.innerHTML =
                `<div class="logo-placeholder">
                    +
                </div>`;

        }

    }


    /* =========================
       SAVE BRAND
    ========================= */

    brandForm.addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            const name =
                brandName.value.trim();

            const description =
                brandDescription.value.trim();


            if (!name) {

                alert(
                    "Please enter a brand name."
                );

                return;

            }


            if (editingBrandId) {

                const brand =
                    brands.find(
                        item =>
                            item.id === editingBrandId
                    );

                if (!brand) return;

                brand.name =
                    name;

                brand.description =
                    description;

                brand.logo =
                    currentLogo;

                selectedBrandId =
                    brand.id;

            } else {

                const newBrand = {

                    id:
                        Date.now().toString(),

                    name:
                        name,

                    description:
                        description,

                    logo:
                        currentLogo,

                    createdAt:
                        new Date().toISOString()

                };


                brands.push(newBrand);

                selectedBrandId =
                    newBrand.id;

            }


            saveData();

            closeModal();

            renderBrandList();

            renderBrand();

        }
    );


    /* =========================
       DELETE BRAND
    ========================= */

    function deleteBrand(id) {

        const brand =
            brands.find(
                item => item.id === id
            );

        if (!brand) return;


        const confirmed =
            confirm(
                `Delete "${brand.name}"? This cannot be undone.`
            );


        if (!confirmed) return;


        brands =
            brands.filter(
                item => item.id !== id
            );


        selectedBrandId = null;

        saveData();

        renderBrandList();

        renderEmptyState();

    }


    /* =========================
       INITIALS
    ========================= */

    function getInitials(name) {

        return name
            .split(" ")
            .filter(Boolean)
            .slice(0, 2)
            .map(word =>
                word.charAt(0).toUpperCase()
            )
            .join("");

    }


    /* =========================
       HTML ESCAPE
    ========================= */

    function escapeHTML(text) {

        return String(text)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");

    }


    /* =========================
       CLOSE MODAL ON BACKDROP
    ========================= */

    modalOverlay.addEventListener(
        "click",
        function(event) {

            if (
                event.target === modalOverlay
            ) {

                closeModal();

            }

        }
    );


    /* =========================
       ESC KEY
    ========================= */

    document.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Escape" &&
                modalOverlay.classList.contains("show")
            ) {

                closeModal();

            }

        }
    );


    /* =========================
       INITIALIZE
    ========================= */

    renderBrandList();

    if (brands.length > 0) {

        selectedBrandId =
            brands[0].id;

        renderBrand();

    } else {

        renderEmptyState();

    }

</script>

</body>
</html>
